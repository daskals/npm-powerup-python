[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "npm-powerup"
version = "0.1.0"
description = "Unofficial Python API for the Nordic nPM1300 Evaluation Kit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Spyros Daskalakis" }]
dependencies = ["pyserial>=3.5"]

[project.urls]
Repository = "https://github.com/daskals/npm-powerup-python"

[project.scripts]
npm-powerup = "npm_powerup.__main__:main"

[tool.setuptools]
packages = ["npm_powerup"]
